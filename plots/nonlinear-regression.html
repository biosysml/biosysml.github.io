<html>
<head>
  <title>Nonlinear Regression</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<div id="plot" style="width:100%;height:100vh;"></div>

<script>

let x = [];
let y = [];

for(let i=0;i<10;i++) {
  x.push(i);
  y.push(Math.sin(i));
}

const trace = {
  x: x,
  y: y,
  mode: 'lines',
  type: 'scatter'
};

Plotly.newPlot('plot',[trace]);

</script>

</body>
</html>
