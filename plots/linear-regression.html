<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swadesh Pal - Live Plots</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        
        
        .app-container { display: flex; height: 96vh; gap: 20px; max-width: 1800px; margin: auto; }
        
        /* LEFT SIDEBAR */
        .left-col { width: 350px; height: fit-content; flex-shrink: 0; background: #fff; border-radius: 12px; border: 1px solid #d1d5da; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .left-header { padding: 15px 15px 10px; background: #f6f8fa; border-bottom: 1px solid #e1e4e8; }
        .left-header h2 { margin: 0 0 10px 0; font-size: 1.1em; color: #0366d6; text-transform: uppercase; letter-spacing: 0.5px; }
        .left-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        
        textarea { width: 100%; height: 75px; font-family: 'Fira Code', monospace; font-size: 0.85em; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-top: 4px; }
        
        /* Compact Color Pickers */
        input[type="color"].compact-color { padding: 0; height: 28px; width: 45px; border: 1px solid #ccc; cursor: pointer; border-radius: 4px; }
        input[type="color"].table-color { width: 24px; height: 24px; padding: 0; border: 1px solid #999; border-radius: 3px; cursor: pointer; }
        
        .category-group { margin-bottom: 18px; }
        .category-title { font-weight: 800; color: #444; font-size: 0.8em; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 4px; margin-bottom: 8px; }
        .func-list { display: flex; flex-direction: column; gap: 5px; padding-left: 5px; }
        .func-list label { font-size: 0.85em; display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; }
        
        .custom-box { background: #f1f8ff; padding: 12px; border-radius: 8px; border: 1px dashed #0366d6; margin-top: 10px; display: none; }
        .custom-box.active { display: block; }
        .syntax-hint { font-size: 0.75em; color: #0366d6; margin-top: 5px; margin-bottom: 10px; font-family: monospace; }
        
        /* RIGHT MAIN CONTENT */
        .right-col { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 5px; }
        .card { background: #fff; border-radius: 12px; border: 1px solid #d1d5da; padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.1s; font-size: 0.85em; text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #2ea44f; color: white; }
        .btn-danger { background: #d73a49; color: white; }
        .btn-secondary { background: #6e7681; color: white; }
        .btn-export { width: 100%; background: #6f42c1; color: white; font-size: 0.9em; padding: 10px; margin-top: 20px; }
        
        /* Reduced Status Bar */
        .status-bar { padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 0.8em; text-align: center; border: 1px solid transparent; display: flex; align-items: center; justify-content: center; margin-top: 20px; }
        .status-idle { background: #f6f8fa; border-color: #d1d5da; color: #444; }
        .status-run { background: #dcffe4; border-color: #2ea44f; color: #1a7f37; }
        
        .canvas-container { height: 800px; position: center; }
        #latexTitleDisplay { text-align: center; margin-bottom: 5px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85em; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e1e4e8; vertical-align: middle; }
        th { background: #f6f8fa; font-weight: 700; color: #586069; }
        .param-badge { font-family: 'Courier New', monospace; background: #fff5b1; padding: 2px 5px; border-radius: 4px; font-weight: bold; color: #735c0f; margin-right: 5px; display: inline-block; margin-bottom: 3px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="left-col">
        <div class="left-header">
            <h2>Data & Models</h2>
            <label style="font-size: 0.85em; font-weight: bold;">Coordinates (x, y):</label>
            <textarea id="dataInput">1, 1.2&#10;2, 3.8&#10;3, 10.5&#10;4, 18.2&#10;5, 29.8&#10;6, 42.1</textarea>
            
            <label style="margin-top:12px; color: #0366d6; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="customToggle" onchange="toggleCustom()"> 
                <strong>Enable Custom Function Builder</strong>
            </label>
            <div class="custom-box" id="customBox">
                <label style="font-size: 0.8em;">Calculation Syntax (JS Math):</label>
                <input type="text" id="customEqStr" value="a * sin(b * x) + c">
                <div class="syntax-hint">Params: a,b,c,d,x</div>
                
                <label style="font-size: 0.8em; margin-top: 5px;">LaTeX Display Label:</label>
                <input type="text" id="customEqLatex" value="a \sin(bx) + c">
                <div class="syntax-hint">Format for the Results Table</div>
            </div>
        </div>
        
        <div class="left-scroll" id="dynamicCheckboxes">
            </div>
    </div>

    <div class="right-col">
        
        <div class="card" style="padding-bottom: 15px;">
            <div class="grid-3">
                <div style="grid-column: span 2;">
                    <div class="grid-4" style="align-items: start;">
                        <div><label>Epochs</label><input type="number" id="epochs" value="2500"></div>
                        <div><label>Learning Rate</label><input type="number" id="lrInput" value="0.05" step="0.01"></div>
                        <div style="grid-column: span 2;">
                            <div id="statusIndicator" class="status-bar status-idle">System Ready</div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="visualizeData()">Plot Data</button>
                        <button class="btn btn-primary" id="startBtn" onclick="toggleTraining()">Start Fitting</button>
                        <button class="btn btn-danger" onclick="forceReset()"> Reset System</button>
                    </div>
                </div>
                
                <div style="border-left: 1px solid #eee; padding-left: 15px;">
                    <label>High-Res Export</label> 
                    <div class="grid-2">
                        <select id="exportFormat"><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
                        <select id="exportRes"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option></select>
                    </div>
                    <button class="btn btn-export" onclick="exportChart()">Download Image</button>
                </div>
            </div>
            
            <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">
            
            <div class="grid-3">
                <div>
                    <label>LaTeX Title</label>
                    <input type="text" id="chartTitle" value="\textbf{Mathematical Regression Suite}" oninput="updateStyles()">
                </div>
                <div><label>X-Axis Label</label><input type="text" id="xLabel" value="Independent (X)" oninput="updateStyles()"></div>
                <div><label>Y-Axis Label</label><input type="text" id="yLabel" value="Dependent (Y)" oninput="updateStyles()"></div>
                
                <div>
                    <label>Sizes (Title | Label | Tick)</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="titleSize" value="22" onchange="updateStyles()">
                        <input type="number" id="labelSize" value="14" onchange="updateStyles()">
                        <input type="number" id="tickSize" value="12" onchange="updateStyles()">
                    </div>
                </div>
                
                <div>
                    <label>X Limits (Min | Max)</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="xMin" value="0" onchange="updateStyles()">
                        <input type="number" id="xMax" value="10" onchange="updateStyles()">
                    </div>
                </div>

                <div>
                    <label style="display:flex; justify-content: space-between; align-items: center;">
                        Y Limits (Min | Max)
                        <span style="font-size:0.85em; font-weight:normal;"><input type="checkbox" id="autoScale" checked onchange="updateStyles()"> Auto</span>
                    </label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="yMin" value="0" onchange="updateStyles()">
                        <input type="number" id="yMax" value="50" onchange="updateStyles()">
                    </div>
                </div>
                
                <div style="grid-column: span 3;">
                    <div class="grid-3">
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#f9f9f9; padding:5px 10px; border-radius:6px; border:1px solid #e1e4e8;">
                            <label style="margin:0;">Background Color:</label>
                            <input type="color" id="chartBg" class="compact-color" value="#ffffff" onchange="updateStyles()">
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#f9f9f9; padding:5px 10px; border-radius:6px; border:1px solid #e1e4e8;">
                            <label style="margin:0;">Raw Data Points Color:</label>
                            <input type="color" id="dataColor" class="compact-color" value="#000000" onchange="updateStyles()">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div id="latexTitleDisplay"></div>
            <div class="canvas-container">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="card" style="padding: 10px 20px;">
            <table>
                <thead>
                    <tr>
                        <th style="width: 160px;">Model (Edit Color)</th>
                        <th style="width: 220px;">Equation Target</th>
                        <th>Learned Parameters (Live)</th>
                        <th style="width: 100px;">Loss (MSE)</th>
                    </tr>
                </thead>
                <tbody id="compBody">
                    <tr><td colspan="4" style="text-align:center; color:#888;">Select functions from the left menu and press Start.</td></tr>
                </tbody>
            </table>
        </div>
        
    </div>
</div>

<script>
    // --- 1. FULL FUNCTION LIBRARY DEFINITION ---
    const libraryCategories = [
        { cat: "Basic Functions", names: ["Linear", "Allometric", "Beta", "Boltzmann", "Dhyperbl", "ExpAssoc", "ExpDecay1", "ExpDecay2", "ExpGrow1", "Gauss", "GaussAmp", "Hyperbl", "Logistic", "LogNormal", "Lorentz", "Rational0", "Sine"] },
        { cat: "Exponential", names: ["Asymptotic", "BoxLucas", "Chapman", "Exp"] },
        { cat: "Growth & Sigmoidal", names: ["Hill", "SGompertz", "SWeibull"] },
        { cat: "Logarithm", names: ["Logarithm"] },
        { cat: "Peak / Waveform", names: ["SineDamp"] },
        { cat: "Power", names: ["Harris", "Power"] }
    ];

    const exactMath = {
        "Linear": { eq: "a + b*x", fStr: "a + b* x", p:['a','b'] },
        "Allometric": { eq: "a x^b + c", fStr: "a*x**b + c", p:['a','b','c'] },
        "Beta": { eq: "y_0 + A(x/w_1)^{w_2}...", fStr: "a*x**3 + b*x**2 + c*x + d", p:['a','b','c','d'] },
        "Boltzmann": { eq: "(a-b)/(1+e^{(x-c)/d})+b", fStr: "(a-b)/(1+Math.exp((x-c)/(d||1e-7)))+b", p:['a','b','c','d'] },
        "Dhyperbl": { eq: "\\frac{ax}{b+x} + \\frac{cx}{d+x}", fStr: "(a*x)/(b+x) + (c*x)/(d+x)", p:['a','b','c','d'] },
        "ExpAssoc": { eq: "a(1-e^{-x/b}) + c(1-e^{-x/d})", fStr: "a*(1-Math.exp(-x/b)) + c*(1-Math.exp(-x/d))", p:['a','b','c','d'] },
        "ExpDecay1": { eq: "a e^{-x/b} + c", fStr: "a*Math.exp(-x/(b||1e-7))+c", p:['a','b','c'] },
        "ExpDecay2": { eq: "a e^{-x/b} + c e^{-x/d}", fStr: "a*Math.exp(-x/(b||1e-7)) + c*Math.exp(-x/(d||1e-7))", p:['a','b','c','d'] },
        "ExpGrow1": { eq: "a e^{x/b} + c", fStr: "a*Math.exp(x/(b||1e-7))+c", p:['a','b','c'] },
        "Gauss": { eq: "a e^{-0.5((x-b)/c)^2}+d", fStr: "a*Math.exp(-0.5*((x-b)/(c||1e-7))**2)+d", p:['a','b','c','d'] },
        "GaussAmp": { eq: "a e^{-0.5((x-b)/c)^2}+d", fStr: "a*Math.exp(-0.5*((x-b)/(c||1e-7))**2)+d", p:['a','b','c','d'] },
        "Hyperbl": { eq: "\\frac{ax}{b+x}", fStr: "a*x/(b+x)", p:['a','b'] },
        "Logistic": { eq: "\\frac{a}{1+e^{-b(x-c)}}+d", fStr: "a/(1+Math.exp(-b*(x-c)))+d", p:['a','b','c','d'] },
        "LogNormal": { eq: "a e^{-\\ln(x/c)^2/d^2}", fStr: "a*Math.exp(-(Math.log(x/c)**2)/(d**2))", p:['a','c','d'] },
        "Lorentz": { eq: "\\frac{a}{1+((x-b)/c)^2}+d", fStr: "a/(1+((x-b)/(c||1e-7))**2)+d", p:['a','b','c','d'] },
        "Rational0": { eq: "\\frac{a+bx}{1+cx}", fStr: "(a+b*x)/(1+c*x)", p:['a','b','c'] },
        "Sine": { eq: "a \\sin(bx+c)+d", fStr: "a*Math.sin(b*x+c)+d", p:['a','b','c','d'] },
        "Asymptotic": { eq: "a - b c^x", fStr: "a - b*(Math.abs(c)**x)", p:['a','b','c'] },
        "BoxLucas": { eq: "a(1-e^{-bx})", fStr: "a*(1-Math.exp(-b*x))", p:['a','b'] },
        "Chapman": { eq: "a(1-e^{-bx})^c", fStr: "a*(1-Math.exp(-b*x))**c", p:['a','b','c'] },
        "Exp": { eq: "a e^{bx}", fStr: "a*Math.exp(b*x)", p:['a','b'] },
        "Hill": { eq: "\\frac{ax^b}{c^b + x^b}", fStr: "a*(x**b)/(c**b + x**b)", p:['a','b','c'] },
        "SGompertz": { eq: "a e^{-e^{-b(x-c)}}", fStr: "a*Math.exp(-Math.exp(-b*(x-c)))", p:['a','b','c'] },
        "SWeibull": { eq: "a - b e^{-c x^d}", fStr: "a - b*Math.exp(-c * (x**d))", p:['a','b','c','d'] },
        "Harris": { eq: "\\frac{1}{a + b x^c}", fStr: "1/(a + b*(x**c))", p:['a','b','c'] },
        "Power": { eq: "a x^b", fStr: "a * x**b", p:['a','b'] },
        "Logarithm": { eq: "a \\ln(x) + b", fStr: "a*Math.log(x)+b", p:['a','b'] },
        "SineDamp": { eq: "a \\sin(bx) e^{-cx}", fStr: "a*Math.sin(b*x)*Math.exp(-c*x)", p:['a','b','c'] }
    };

    const menuDiv = document.getElementById('dynamicCheckboxes');
    let menuHtml = '';
    libraryCategories.forEach(grp => {
        menuHtml += `<div class="category-group">
            <div class="category-title">${grp.cat}</div>
            <div class="func-list">`;
        grp.names.forEach(name => {
            const chk = (name==='Power'||name==='Gauss') ? 'checked' : '';
            menuHtml += `<label><input type="checkbox" class="model-checkbox" value="${name}" ${chk}> ${name}</label>`;
        });
        menuHtml += `</div></div>`;
    });
    menuDiv.innerHTML = menuHtml;

    // --- 2. GLOBAL STATE & LOGIC ---
    let chart;
    let isTraining = false, shouldStop = false, currentEpoch = 0;
    let activeModels = [];
    let plotXs = [], xsData = [], ysData = [];

    const bgPlugin = {
        id: 'customCanvasBackgroundColor',
        beforeDraw: (chart, args, options) => {
            const {ctx} = chart; ctx.save(); ctx.globalCompositeOperation = 'destination-over';
            ctx.fillStyle = options.color || '#ffffff'; ctx.fillRect(0, 0, chart.width, chart.height); ctx.restore();
        }
    };

    const setStatus = (msg, cls) => {
        const s = document.getElementById('statusIndicator');
        s.innerText = msg; s.className = `status-bar ${cls}`;
    };

    const toggleCustom = () => document.getElementById('customBox').classList.toggle('active', document.getElementById('customToggle').checked);

    function prepareCustomFunction(eqStr) {
        const parsedEq = eqStr.replace(/\bMath\./g, '').replace(/\bsin\b/g, 'Math.sin').replace(/\bcos\b/g, 'Math.cos')
            .replace(/\btan\b/g, 'Math.tan').replace(/\bexp\b/g, 'Math.exp').replace(/\bln\b/g, 'Math.log')
            .replace(/\blog\b/g, 'Math.log').replace(/\bsqrt\b/g, 'Math.sqrt').replace(/\bPI\b/g, 'Math.PI')
            .replace(/\babs\b/g, 'Math.abs').replace(/\^/g, '**');
        return new Function('a', 'b', 'c', 'd', 'x', `return ${parsedEq};`);
    }

    function numericGradient(f, a, b, c, d, xs, ys) {
        const eps = 1e-5; let loss = 0, da = 0, db = 0, dc = 0, dd = 0;
        const n = xs.length;
        try {
            for (let i = 0; i < n; i++) {
                const x = xs[i], y = ys[i], pred = f(a, b, c, d, x);
                if (isNaN(pred)) throw new Error('NaN');
                const err = pred - y; loss += err * err;
                da += 2 * err * (f(a+eps, b, c, d, x) - f(a-eps, b, c, d, x)) / (2*eps);
                db += 2 * err * (f(a, b+eps, c, d, x) - f(a, b-eps, c, d, x)) / (2*eps);
                dc += 2 * err * (f(a, b, c+eps, d, x) - f(a, b, c-eps, d, x)) / (2*eps);
                dd += 2 * err * (f(a, b, c, d+eps, x) - f(a, b, c, d-eps, x)) / (2*eps);
            }
            return { loss: loss / n, grad: [da / n, db / n, dc / n, dd / n] };
        } catch(e) { return { loss: NaN, grad: [NaN, NaN, NaN, NaN] }; }
    }

    class AdamCustom {
        constructor(lr=0.05) { this.lr = lr; this.m = [0,0,0,0]; this.v = [0,0,0,0]; this.t = 0; }
        step(params, grads) {
            this.t++;
            for(let i=0; i<4; i++) {
                if (isNaN(grads[i]) || !isFinite(grads[i])) continue;
                this.m[i] = 0.9 * this.m[i] + 0.1 * grads[i];
                this.v[i] = 0.999 * this.v[i] + 0.001 * grads[i]*grads[i];
                params[i] -= this.lr * (this.m[i] / (1 - Math.pow(0.9, this.t))) / (Math.sqrt(this.v[i] / (1 - Math.pow(0.999, this.t))) + 1e-8);
            }
        }
    }

    const parseData = () => {
        return document.getElementById('dataInput').value.trim().split('\n').reduce((acc, r) => {
            const p = r.split(',').map(Number);
            if (p.length === 2 && !isNaN(p[0]) && !isNaN(p[1])) { acc.xs.push(p[0]); acc.ys.push(p[1]); }
            return acc;
        }, {xs:[], ys:[]});
    };

    function updateCurveColor(modelId, newColor) {
        const mIndex = activeModels.findIndex(m => m.id === modelId);
        if(mIndex !== -1 && chart) {
            activeModels[mIndex].color = newColor;
            chart.data.datasets[mIndex + 1].borderColor = newColor;
            chart.update('none');
        }
    }

    function updateStyles() {
        const titleEl = document.getElementById('latexTitleDisplay');
        titleEl.innerHTML = `\\( ${document.getElementById('chartTitle').value} \\)`;
        titleEl.style.fontSize = `${document.getElementById('titleSize').value}px`;
        MathJax.typesetPromise([titleEl]);

        if (chart) {
            const lSize = parseInt(document.getElementById('labelSize').value);
            const tSize = parseInt(document.getElementById('tickSize').value);

            // Bg & Data Colors
            chart.options.plugins.customCanvasBackgroundColor.color = document.getElementById('chartBg').value;
            if(chart.data.datasets[0]) {
                chart.data.datasets[0].backgroundColor = document.getElementById('dataColor').value;
            }

            // Axes
            chart.options.scales.x.title.display = true; chart.options.scales.x.title.text = document.getElementById('xLabel').value;
            chart.options.scales.x.title.font = { size: lSize, weight: 'bold' }; chart.options.scales.x.ticks.font = { size: tSize };
            
            chart.options.scales.y.title.display = true; chart.options.scales.y.title.text = document.getElementById('yLabel').value;
            chart.options.scales.y.title.font = { size: lSize, weight: 'bold' }; chart.options.scales.y.ticks.font = { size: tSize };

            if (document.getElementById('autoScale').checked) {
                const { xs, ys } = parseData();
                if(xs.length) {
                    const px = (Math.max(...xs)-Math.min(...xs))*0.15||1, py = (Math.max(...ys)-Math.min(...ys))*0.2||1;
                    chart.options.scales.x.min = Math.min(...xs)-px; chart.options.scales.x.max = Math.max(...xs)+px;
                    chart.options.scales.y.min = Math.min(...ys)-py; chart.options.scales.y.max = Math.max(...ys)+py;
                    document.getElementById('xMin').value = chart.options.scales.x.min.toFixed(1);
                    document.getElementById('xMax').value = chart.options.scales.x.max.toFixed(1);
                    document.getElementById('yMin').value = chart.options.scales.y.min.toFixed(1);
                    document.getElementById('yMax').value = chart.options.scales.y.max.toFixed(1);
                }
            } else {
                chart.options.scales.x.min = parseFloat(document.getElementById('xMin').value);
                chart.options.scales.x.max = parseFloat(document.getElementById('xMax').value);
                chart.options.scales.y.min = parseFloat(document.getElementById('yMin').value);
                chart.options.scales.y.max = parseFloat(document.getElementById('yMax').value);
            }
            chart.update();
        }
    }

    function initChart(xs, ys, models) {
        if (chart) chart.destroy();
        const dataCol = document.getElementById('dataColor').value;
        const datasets = [{ label: 'Raw Data', data: xs.map((x, i) => ({x, y: ys[i]})), backgroundColor: dataCol, pointRadius: 6, zIndex: 10 }];
        models.forEach(m => datasets.push({ label: m.name, data: [], type: 'line', borderColor: m.color, borderWidth: 3, pointRadius: 0, fill: false, showLine: true, tension: 0.1 }));
        
        chart = new Chart(document.getElementById('mainChart').getContext('2d'), {
            type: 'scatter', data: { datasets },
            options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { customCanvasBackgroundColor: { color: document.getElementById('chartBg').value } }, scales: { x: { type: 'linear' }, y: { type: 'linear' } } },
            plugins: [bgPlugin]
        });
        updateStyles();
    }

    function visualizeData() {
        forceReset();
        const { xs, ys } = parseData();
        if(!xs.length) return setStatus("Invalid Data", "status-idle");
        initChart(xs, ys, []);
        setStatus("Data Rendered", "status-idle");
    }

    function forceReset() {
        isTraining = false; shouldStop = true; currentEpoch = 0;
        document.getElementById('startBtn').innerText = "Start Fitting";
        document.getElementById('compBody').innerHTML = '<tr><td colspan="4" style="text-align:center;">Select functions from the left menu and press Start.</td></tr>';
        setStatus("System Reset", "status-idle");
    }

    async function initializeTraining() {
        const { xs, ys } = parseData();
        xsData = xs; ysData = ys;
        
        let selectedNames = Array.from(document.querySelectorAll('.model-checkbox:checked')).map(cb => cb.value);
        selectedNames = [...new Set(selectedNames)]; 
        
        if (xs.length < 2 || (!selectedNames.length && !document.getElementById('customToggle').checked)) return false;

        activeModels = [];
        const lr = parseFloat(document.getElementById('lrInput').value);

        selectedNames.forEach(name => {
            const math = exactMath[name] || { eq: "a + bx + cx^2", fStr: "a + b*x + c*(x**2)", p:['a','b','c'] };
            activeModels.push({
                id: name, name: name, eq: math.eq, p: math.p,
                color: `#${Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')}`,
                cVars: [Math.random()*0.1, Math.random()*0.1, Math.random()*0.1, Math.random()*0.1],
                cAdam: new AdamCustom(lr), customF: prepareCustomFunction(math.fStr)
            });
        });

        if (document.getElementById('customToggle').checked) {
            activeModels.push({
                id: 'customJS', name: 'Custom User Eq', 
                eq: document.getElementById('customEqLatex').value, // NOW USES CUSTOM LATEX LABEL
                p: ['a','b','c','d'], color: '#333333',
                cVars: [Math.random()*0.1, Math.random()*0.1, Math.random()*0.1, Math.random()*0.1],
                cAdam: new AdamCustom(lr), customF: prepareCustomFunction(document.getElementById('customEqStr').value)
            });
        }

        initChart(xs, ys, activeModels);
        document.getElementById('compBody').innerHTML = '';

        activeModels.forEach(m => {
            const eqTex = m.eq; // Both default and custom are now raw LaTeX strings
            document.getElementById('compBody').innerHTML += `<tr>
                <td style="display:flex; align-items:center; gap:8px;">
                    <input type="color" class="table-color" value="${m.color}" onchange="updateCurveColor('${m.id}', this.value)">
                    <strong>${m.name}</strong>
                </td>
                <td>$y = ${eqTex}$</td>
                <td id="p-${m.id}" style="line-height:1.6;">-</td>
                <td id="m-${m.id}" style="font-weight:bold; font-family:monospace;">-</td>
            </tr>`;
        });

        const minX = Math.min(...xs), maxX = Math.max(...xs), range = maxX-minX;
        plotXs = Array.from({length: 120}, (_, i) => (minX - range*0.1) + (range*1.2)*(i/120));
        MathJax.typesetPromise();
        return true;
    }

    async function toggleTraining() {
        if (isTraining) { shouldStop = true; return; }
        if (currentEpoch === 0 && !(await initializeTraining())) return alert("Provide data and select at least one model from the left menu.");

        isTraining = true; shouldStop = false;
        document.getElementById('startBtn').innerText = "Pause Engine";
        setStatus("Optimizer Running...", "status-run");

        const epochs = parseInt(document.getElementById('epochs').value);

        for (; currentEpoch <= epochs; currentEpoch++) {
            if (shouldStop) break;
            
            activeModels.forEach(m => {
                const { loss, grad } = numericGradient(m.customF, m.cVars[0], m.cVars[1], m.cVars[2], m.cVars[3], xsData, ysData);
                m.cAdam.step(m.cVars, grad);
                m.currentLoss = loss;
            });

            if (currentEpoch % 40 === 0 || currentEpoch === epochs) {
                activeModels.forEach((m, idx) => {
                    const pDisplay = m.p.map((pn, i) => `<span class="param-badge">${pn}</span>${m.cVars[i].toFixed(3)}`).join(' ');
                    const mappedData = [];
                    for(let j=0; j<plotXs.length; j++) {
                        const py = m.customF(m.cVars[0], m.cVars[1], m.cVars[2], m.cVars[3], plotXs[j]);
                        if(Number.isFinite(py)) mappedData.push({x: plotXs[j], y: py});
                    }
                    document.getElementById(`m-${m.id}`).innerText = (m.currentLoss !== undefined && !isNaN(m.currentLoss)) ? m.currentLoss.toFixed(4) : 'NaN';
                    document.getElementById(`p-${m.id}`).innerHTML = pDisplay;
                    chart.data.datasets[idx+1].data = mappedData;
                });
                chart.update('none');
                await new Promise(r => setTimeout(r, 0)); 
            }
        }
        isTraining = false;
        document.getElementById('startBtn').innerText = currentEpoch >= epochs ? "Finished" : "Resume";
        setStatus(currentEpoch >= epochs ? "Optimization Complete" : "System Paused", "status-idle");
    }

    function exportChart() {
        if (!chart) return;
        const format = document.getElementById('exportFormat').value; 
        const res = parseInt(document.getElementById('exportRes').value);
        const origRatio = window.devicePixelRatio;
        window.devicePixelRatio = origRatio * res;
        chart.resize(); chart.render();

        setTimeout(() => {
            const a = document.createElement('a');
            a.href = chart.toBase64Image(`image/${format}`, 1.0);
            a.download = `Swadesh_Export_${new Date().getTime()}.${format}`;
            a.click();
            window.devicePixelRatio = origRatio;
            chart.resize(); chart.render();
        }, 150);
    }

    window.onload = () => { setStatus("Ready", "status-idle"); updateStyles(); };
</script>
</body>
</html>
