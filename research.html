<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research | BioSysML Lab</title>

  <link rel="stylesheet" href="css/style.css">
</head>

  <script>
    function resizeIframe(iframe) {

        function setHeight() {
            iframe.style.height =
                iframe.contentWindow.document.body.scrollHeight + "px";
        }

        setHeight();

        iframe.contentWindow.addEventListener('resize', setHeight);

        const observer = new MutationObserver(setHeight);

        observer.observe(
            iframe.contentWindow.document.body,
            {
                childList: true,
                subtree: true,
                attributes: true
            }
        );
    }
    </script>
<body>


<header>
  <div class="logo">BioSysML Lab</div>

  <nav>
    <a href="/">Home</a>
    <a href="/research">Research</a>
    <a href="/liveplots">Live Plots</a>
    <a href="/team">Team</a>
    <a href="/publications">Publications</a>
    <a href="/news">News</a>
    <a href="/contact">Contact</a>
  </nav>
</header>

<div class="dashboard-layout">

  <aside class="sidebar">
    <h2>Research Areas</h2>
    
    <button onclick="showResearch('ecology')">
      Ecological Dynamics
    </button>

    <button onclick="showResearch('neuro')">
      Computational Neuroscience
    </button>

    
    <button onclick="showResearch('ml')">
      Scientific Machine Learning
    </button>

    <button onclick="showResearch('pinns')">
      PINNs & AI Simulations
    </button>
  </aside>

  <main class="content-panel">

    <div id="ecology" class="research-content active-content">
      <div class="research-frame">
        <iframe src="res/ecological-dynamics.html" scrolling="no" frameborder="0" onload="resizeIframe(this)></iframe>
      </div>
    </div>
    

    <div id="neuro" class="research-content">
       <div class="research-frame">
      <iframe src="res/computational-neuroscience.html" scrolling="no" frameborder="0" onload="resizeIframe(this)></iframe>
      </div>
    </div>

    

    <div id="ml" class="research-content">
      <div class="research-frame">
      <iframe src="res/scientific-machine-learning.html" scrolling="no" frameborder="0" onload="resizeIframe(this)></iframe>
      </div>
    </div>

    <div id="pinns" class="research-content">
      <div class="research-frame">
      <iframe src="res/pinns-ai-simulations.html" scrolling="no" frameborder="0" onload="resizeIframe(this)></iframe>
      </div>
    </div>

  </main>

</div>

<script src="js/research.js"></script>
</body>
</html>
