<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research | BioSysML Lab</title>

  <link rel="stylesheet" href="css/style.css">
</head>


<body>


<header>
  <div class="logo">BioSysML Lab</div>

  <nav>
    <a href="/">Home</a>
    <a href="/research">Research</a>
    <a href="/liveplots">Live Plots</a>
    <a href="/team">Team</a>
    <a href="/publications">Publications</a>
    <a href="/news">News</a>
    <a href="/contact">Contact</a>
  </nav>
</header>

<div class="dashboard-layout">

  <aside class="sidebar">
    <h2>Research Areas</h2>
    
    <button onclick="showResearch('ecology')">
      Ecological Dynamics
    </button>

    <button onclick="showResearch('neuro')">
      Computational Neuroscience
    </button>

    <button onclick="showResearch('ml')">
      Scientific Machine Learning
    </button>

    <button onclick="showResearch('pinns')">
      PINNs & AI Simulations
    </button>
  </aside>

  <main class="content-panel">

    <div id="ecology" class="research-content active-content">
      <iframe src="res/ecological-dynamics.html" scrolling="no"></iframe>
    </div>

    <div id="neuro" class="research-content">
      <iframe src="res/computational-neuroscience.html" scrolling="no"></iframe>
    </div>

    <div id="ml" class="research-content">
      <iframe src="res/scientific-machine-learning.html" scrolling="no"></iframe>
    </div>

    <div id="pinns" class="research-content">
      <iframe src="res/pinns-ai-simulations.html" scrolling="no"></iframe>
    </div>

  </main>

</div>

<script src="js/research.js"></script>

<script>
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'resize') {
      const iframes = document.querySelectorAll('iframe');
      iframes.forEach(iframe => {
        if (iframe.contentWindow === e.source) {
          // Exactly the height of the content, no extra buffer
          iframe.style.height = e.data.height + 'px'; 
        }
      });
    }
  });
</script>

<footer>
  <p>   © 2026 BioSysML Lab</p>
</footer>
</body>
</html>
