<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Plots | BioSysML Lab</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">BioSysML Lab</div>

  <nav>
    <a href="/">Home</a>
    <a href="/research">Research</a>
    <a href="/liveplots">Live Plots</a>
    <a href="/team">Team</a>
    <a href="/publications">Publications</a>
    <a href="/news">News</a>
    <a href="/contact">Contact</a>
  </nav>
</header>


<div class="dashboard-layout">

  <aside class="sidebar">
    <h2>Plot Types</h2>

    <button onclick="showPlot('vectorplot')">
      Vector Plots
    </button>

    <button onclick="showPlot('odesolver')">
      Numerical ODE Solver
    </button>
    
    <button onclick="showPlot('bifurcation')">
      Bifurcation Diagrams
    </button>

    <button onclick="showPlot('linearreg')">
      Linear and Nonlinear Regression
    </button>

  </aside>

  <main class="content-panel">

    <div id="vectorplot" class="plot-content active-content">
      <h1>Interactive Vector Field Generator</h1>
      
      <iframe src="plots/vector-field.html" scrolling="no"></iframe>
    </div>

    <div id="odesolver" class="plot-content">
      <h1>Numerical ODE Solver</h1>
      
      <iframe src="plots/ode-solver.html" scrolling="no"></iframe>
    </div>
    
    <div id="bifurcation" class="plot-content">
      <h1>Bifurcation Diagrams</h1>

      <iframe src="plots/bifurcation.html" scrolling="no"></iframe>
    </div>

    <div id="linearreg" class="plot-content">
      <h1>Linear and Nonlinear Regression</h1>

      <iframe src="plots/linear-regression.html" scrolling="no"></iframe>
    </div>

  </main>

</div>


<script src="js/plots.js"></script><script>
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'resize') {
      const iframes = document.querySelectorAll('iframe');
      iframes.forEach(iframe => {
        if (iframe.contentWindow === e.source) {
          // Exactly the height of the content, no extra buffer
          iframe.style.height = e.data.height + 'px'; 
        }
      });
    }
  });
</script>


<script src="js/plots.js"></script>
  
<footer>
  <p>© 2026 BioSysML Lab</p>
</footer>
</body>
</html>
